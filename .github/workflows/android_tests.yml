name: Android CI - Unit Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Remove local.properties
      run: rm -f local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Upload Test Reports
      if: always() && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/reports/tests/testDebugUnitTest/

  deploy:
    name: Build and Deploy APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: echo "y" | sdkmanager "build-tools;29.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Checkout Destination Repo
        uses: actions/checkout@v4
        with:
          repository: B-Vazquez/Vacation-Planner-APK
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}
          path: destination-repo

      - name: Copy Signed APK to Destination Repo
        run: cp ${{ steps.sign_app.outputs.signedReleaseFile }} destination-repo/app-release.apk

      - name: Commit and Push APK
        working-directory: destination-repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app-release.apk
          git commit -m "Update app-release.apk" || echo "No changes to commit"
          git push
